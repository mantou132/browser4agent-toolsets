name: Publish

on:
  push:
    branches: [main]
    paths: ['toolsets/**']
  # Manual runs republish every toolset.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish changed toolsets
        env:
          MARKET_TOKEN: ${{ secrets.MARKET_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- toolsets/)
            if [ -z "$files" ]; then echo "No changed toolsets."; exit 0; fi
            node scripts/publish.mjs --publish $files
          else
            node scripts/publish.mjs --publish
          fi
