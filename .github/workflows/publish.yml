name: Publish

on:
  push:
    branches: [main]
    paths: ['toolsets/**']
  # Manual runs republish every toolset (deletions are only synced on push).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync changed toolsets to the market
        env:
          MARKET_TOKEN: ${{ secrets.MARKET_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The first push to a branch has no previous commit; fall back to republishing everything.
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/publish.mjs --publish --since "$BEFORE"
          else
            node scripts/publish.mjs --publish
          fi
