name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changed toolsets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/publish.mjs --since "$BASE"
